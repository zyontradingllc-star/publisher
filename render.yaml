# Authors Pilot platform — Render Blueprint (Railway alternative)
# Dashboard: New → Blueprint → connect zyontradingllc-star/publisher
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: authorspilot-platform
    runtime: docker
    plan: starter
    region: oregon
    rootDir: apps/platform
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /publish/
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - apps/platform/**
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_SITE_URL
        value: https://app.authorspilot.com
      - key: NEXT_PUBLIC_APP_URL
        value: https://app.authorspilot.com
      - key: NEXT_PUBLIC_MARKETING_URL
        value: https://authorspilot.com
      - key: PUBLIC_SITE_URL
        value: https://authorspilot.com
      - key: EMAIL_FROM
        value: Authors Pilot <no-reply@authorspilot.com>
      - key: ADMIN_NOTIFICATION_EMAIL
        value: hello@authorspilot.com
      - key: PAYLOAD_SECRET
        generateValue: true
      # Paste from apps/platform/.env.local in Render dashboard (first deploy prompts):
      - key: DATABASE_URL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_API_KEY
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_PROJECT_ID
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_APP_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
