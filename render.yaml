# Authors Pilot — complete Render Blueprint
# Marketing (static) stays on Hostinger; this deploys the publishing platform only.
# Apply: https://dashboard.render.com/blueprint/new?repo=https://github.com/zyontradingllc-star/publisher
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: authorspilot-platform
    runtime: docker
    plan: starter
    region: oregon
    rootDir: apps/platform
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /publish/
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - apps/platform/**
    envVars:
      # --- Runtime ---
      - key: NODE_ENV
        value: production
      - key: HOSTNAME
        value: "0.0.0.0"

      # --- Public URLs ---
      - key: NEXT_PUBLIC_SITE_URL
        value: https://app.authorspilot.com
      - key: NEXT_PUBLIC_APP_URL
        value: https://app.authorspilot.com
      - key: NEXT_PUBLIC_MARKETING_URL
        value: https://authorspilot.com
      - key: PUBLIC_SITE_URL
        value: https://authorspilot.com

      # --- Email ---
      - key: EMAIL_FROM
        value: Authors Pilot <no-reply@authorspilot.com>
      - key: ADMIN_NOTIFICATION_EMAIL
        value: info@authorspilot.com
      - key: RESEND_API_KEY
        sync: false

      # --- Upload limits ---
      - key: MAX_COVER_BYTES
        value: "5242880"
      - key: MAX_MANUSCRIPT_BYTES
        value: "26214400"

      # --- Payload CMS ---
      - key: PAYLOAD_SECRET
        generateValue: true

      # --- MongoDB (Atlas) — paste from apps/platform/.env.local ---
      - key: DATABASE_URL
        sync: false
      - key: MONGODB_URI
        sync: false

      # --- Firebase (client) ---
      - key: NEXT_PUBLIC_FIREBASE_API_KEY
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_PROJECT_ID
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_APP_ID
        sync: false

      # --- Firebase (admin / server) ---
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
